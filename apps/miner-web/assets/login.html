<body>
    <div class="login-container">
        <div class="login-logo"></div>
        <form name="loginform" method="post" action="/api/v1/session" onsubmit="checkLogin(event)" style="display: none;">
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Password" maxlength="64" oninput="showLoginError('')">
                <span class="eye-icon" onclick="togglePasswordVisibility()"></span>
            </div>
            <div class="login-error" role="alert"></div>
            <button type="submit" id="login-button">Login</button>
        </form>
        <div class="or-text" style="display: none;">OR</div>
        <a id="qrlink" href="#" onclick="qrlogin()" style="display: none;">Login with QR Code</a>
        <div id="startblock" style="color: #060000;">Starting...</div>
        <div id="qrblock" style="display: none;">
            <div id="qrcode" style="display: flex; justify-content: center; height: 120px;"></div>
            <div class="qrcode-tip" style="margin-top: 16px; color: #060000;">Not activated: scan with the App to bind</div>
        </div>
    </div>

</body>

<script>
    function $(element) {
        return document.querySelector(element);
    }
    function AJAX(url, callback) {
        var req = AJAX_init();
        req.onreadystatechange = AJAX_processRequest;
        function AJAX_init() {
            if (window.XMLHttpRequest) {
                return new XMLHttpRequest();
            } else {
                if (window.ActiveXObject) {
                    return new ActiveXObject("Microsoft.XMLHTTP");
                }
            }
        }
        function AJAX_processRequest() {
            if (req.readyState == 4) {
                if (req.status == 200) {
                    if (callback) {
                        callback(req.responseText);
                    }
                }
            }
        }
        this.doGet = function () {
            req.open("GET", url, true);
            req.send(null);
        };
        this.doPost = function (body) {
            req.open("POST", url, true);
            req.setRequestHeader(
                "Content-Type",
                "application/x-www-form-urlencoded"
            );
            req.setRequestHeader("ISAJAX", "yes");
            req.send(body);
        };
    }

    // A cookie set over HTTPS stays off plain HTTP.
    function secureAttr() {
        return location.protocol === "https:" ? "; Secure" : "";
    }

    function setCookie(name, value, days) {
        var expires = "";
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict" + secureAttr();
    }

    function clearCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/" + secureAttr() + ";";
    }

    let getAuthTimer = null;
    let globalAuth = "";
    function renderQrcode(plaintext) {
        new QRCode(document.getElementById("qrcode"), {
            text: plaintext,
            width: 120,
            height: 120,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }
    function getAuthCallback(req) {
        if (req && req.auth) {
            if (getAuthTimer) {
                clearInterval(getAuthTimer);
            }
            globalAuth = req.auth;
            // Only an activated device offers the password login; anything else
            // keeps the QR-only page.
            if (req.starting) {
                const startPoll = setInterval(() => {
                    fetch("/api/v1/activation", {cache: "no-store"})
                        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                        .then(state => { if (!state.starting) { clearInterval(startPoll); location.reload(); } })
                        .catch(() => {});
                }, 3000);
            } else if (req.activated === 1 || req.activated === "1") {
                document.getElementById("startblock").style.display = "none";
                loginform.style.display = "";
                $(".or-text").style.display = "";
                document.getElementById("qrlink").style.display = "";
            } else {
                document.getElementById("startblock").style.display = "none";
                document.getElementById("qrblock").style.display = "";
                const activationPoll = setInterval(() => {
                    fetch("/api/v1/activation", {cache: "no-store"})
                        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                        .then(state => { if (state.activated) { clearInterval(activationPoll); location.reload(); } })
                        .catch(() => {});
                }, 3000);
                try {
                    renderQrcode(JSON.stringify({ auth: req.auth, code: req.code }));
                } catch (e) {
                    console.log("qr err:" + e.message);
                }
            }
        }
    }

    function getAuth() {
        let oUpdate;
        oUpdate = new AJAX("/api/v1/auth?num=" + Math.random(),
            function (t) {
                try {
                    getAuthCallback(JSON.parse(t))
                } catch (e) {
                    console.log("get auth err:" + e.message)
                }
            });
        oUpdate.doGet();
    }

    // Only a rejected password marks the input; the other failures are not its fault.
    function showLoginError(text, badPassword) {
        $(".login-error").textContent = text;
        loginform.password.classList.toggle("input-error", !!badPassword);
        loginform.password.setAttribute("aria-invalid", badPassword ? "true" : "false");
        if (text) {
            const box = $(".password-wrapper");
            box.classList.remove("shake");
            void box.offsetWidth; // reflow, so a repeated identical failure still shakes
            box.classList.add("shake");
        }
    }

    function setLoginBusy(busy) {
        const button = $("#login-button");
        button.disabled = busy;
        button.textContent = busy ? "Logging in…" : "Login";
    }

    // /api/v1/session has no server-side deadline; give up so the button is usable again.
    const LOGIN_TIMEOUT_MS = 15000;

    function loginFailed(text, badPassword) {
        clearCookie("auth");
        showLoginError(text, badPassword);
        setLoginBusy(false);
        loginform.password.focus();
    }

    function checkLogin(event) {
        // Cancel the native submit first, so nothing thrown below can post the plaintext password.
        event.preventDefault();
        showLoginError("");
        if (loginform.password.value == "") {
            alert("Password is null!");
            return false;
        }
        if (loginform.password.value.length > 64) {
            alert("Password too long!");
            return false;
        }
        // Without the nonce the proof is too short and even a correct password gets 401.
        if (!globalAuth) {
            showLoginError("Connecting to the device, please try again in a moment.");
            return false;
        }
        let hashpasswd = sha256(loginform.password.value).substring(0, 24);
        hashpasswd = globalAuth + hashpasswd;
        setCookie("auth", hashpasswd, 1);
        loginform.password.value = "";
        setLoginBusy(true);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/v1/session", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.timeout = LOGIN_TIMEOUT_MS;
        xhr.onload = function () {
            // Success is 200 with the auth cookie set; go to the dashboard.
            if (xhr.status == 200) {
                location.href = "dashboard.html";
                return;
            }
            if (xhr.status == 401) {
                loginFailed("Incorrect password, please try again.", true);
            } else if (xhr.status == 403) {
                loginFailed("Device not activated, please bind it with the App.");
            } else {
                loginFailed(`Login failed (HTTP ${xhr.status}), please try again.`);
            }
        };
        xhr.onerror = function () {
            loginFailed("The login request did not reach the device.");
        };
        xhr.ontimeout = function () {
            loginFailed("The device did not answer, please try again.");
        };
        xhr.send("passwd=" + hashpasswd);
    }

    function qrlogin() {
        location.href = "qr_login.html";
    }

    getAuth();
    getAuthTimer = setInterval(function () { getAuth() }, 5000);

    clearCookie("auth");
</script>
