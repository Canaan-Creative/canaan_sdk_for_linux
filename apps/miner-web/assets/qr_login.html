    <div class="login-container">
        <div class="login-logo"></div>
        <div class="qrcode-wrapper">
            <div id="qrcode"></div>
            <div class="qrcode-tip">Scan the QR Code with Your <a href="https://www.canaan.io/avalonfamily" target="_blank" style="color: #060000; text-decoration: underline;">Avalon Family APP</a></div>
        </div>
        <form name="loginform" action="/" method="get" style="display: none;"></form>
    </div>
    <div class="copyright">Copyright © Canaan Creative Co., Ltd.</div>
</body>

<script>
    function AJAX(url, callback) {
        var req = AJAX_init();
        req.onreadystatechange = AJAX_processRequest;
        function AJAX_init() {
            if (window.XMLHttpRequest) {
                return new XMLHttpRequest();
            } else {
                if (window.ActiveXObject) {
                    return new ActiveXObject("Microsoft.XMLHTTP");
                }
            }
        }
        function AJAX_processRequest() {
            if (req.readyState == 4) {
                if (req.status == 200) {
                    if (callback) {
                        callback(req.responseText);
                    }
                }
            }
        }
        this.doGet = function () {
            req.open("GET", url, true);
            req.send(null);
        };
        this.doPost = function (body) {
            req.open("POST", url, true);
            req.setRequestHeader(
                "Content-Type",
                "application/x-www-form-urlencoded"
            );
            req.setRequestHeader("ISAJAX", "yes");
            req.send(body);
        };
    }

    // A cookie set over HTTPS stays off plain HTTP.
    function secureAttr() {
        return location.protocol === "https:" ? "; Secure" : "";
    }

    function clearCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/" + secureAttr() + ";";
    }

    let getAuthTimer = null;
    let qrSession = "";
    function getAuthCallback(req) {
        if (req && req.auth && req.session) {
            if (getAuthTimer) {
                clearInterval(getAuthTimer);
            }
            try {
                qrSession = req.session || "";
                let plaintext = JSON.stringify({auth: req.auth, code: req.code});
                renderQrcode(plaintext);
            } catch (e) {
                console.log("err:" + e.message)
            }
        }
    }

    function getCookieCallback(req) {
        if (req && req.auth) {
            location.href = "dashboard.html";
        }
    }

    function getAuth() {
        let oUpdate;
        oUpdate = new AJAX("/api/v1/auth?num=" + Math.random(),
            function (t) {
                try {
                    getAuthCallback(JSON.parse(t))
                } catch (e) {
                    console.log("get auth err:" + e.message)
                }
            });
        oUpdate.doGet();
    }

    function renderQrcode(plaintext) {
        let qrcode = new QRCode(document.getElementById("qrcode"), {
            text: plaintext,
            width: 120,
            height: 120,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function checkLogin() {
        if (!qrSession) return;
        let oUpdate;
        oUpdate = new AJAX("/api/v1/qr-login?num=" + Math.random(),
            function (t) {
                try {
                    getCookieCallback(JSON.parse(t))
                } catch (e) {
                    console.log("check login err:" + e.message)
                }
            });
        oUpdate.doPost("session=" + encodeURIComponent(qrSession));
    }

    function passwdLogin() {
        loginform.submit();
    }

    setTimeout(() => {
        getAuth()
        getAuthTimer = setInterval(function () { getAuth() }, 5000);
    }, 800);

    setInterval(function () { checkLogin() }, 5000);
    clearCookie("auth");
    setTimeout(() => location.reload(), 290000);
</script>
