# Canaan K230 Avalon Nano3s: SPI-NAND miner.
require conf/distro/canaan-k230.conf

MACHINE ?= "k230-nano3s"

DISTRO = "canaan-k230-nano3s"
DISTRO_NAME = "Canaan K230 Nano3s"

PREFERRED_VERSION_opensbi = "1.7"

# Serial login on ttyS1. Set here because the distro conf is parsed after
# the machine conf and k6.6ry.inc.
SERIAL_CONSOLES = "115200;ttyS1"

hostname:pn-base-files = "nano3s"

# The LCD is driven through /dev/fb0.
DISTRO_FEATURES:remove = " x11 "

VIRTUAL-RUNTIME_keymaps = ""

COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"
