# Canaan K230 base distribution: Linux 6.6, GCC, sysvinit.
require conf/distro/rv64-k6.6-default.conf

# The required conf hard-sets MACHINE; take it from CANAAN_MACHINE instead.
CANAAN_MACHINE ??= "k230-nano3s"
MACHINE = "${CANAAN_MACHINE}"

DISTRO = "canaan-k230"
DISTRO_NAME = "Canaan K230"
CANAAN_SDK_VERSION ??= "0.0.0"
DISTRO_VERSION = "${CANAAN_SDK_VERSION}"

PREFERRED_PROVIDER_virtual/kernel = "linux-k230"
PREFERRED_VERSION_linux-k230 = "6.6.36+git%"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-k230"
PREFERRED_PROVIDER_u-boot = "u-boot-k230"

PREFERRED_VERSION_opensbi = "1.7"

PREFERRED_VERSION_openssl = "3.5.9"
PREFERRED_VERSION_openssl-native = "3.5.9"

# "1" adds -DCONFIG_RT_SMART_RUN_CORE_ID=0 to the U-Boot build.
K230_AMP ?= "0"

ROOTFS_POSTPROCESS_COMMAND:remove = "rootfs_update_timestamp;"

PACKAGE_FEED_URIS = ""

# On-target diagnostic tools; local.conf enables the feature.
FEATURE_PACKAGES_canaan-debug = "packagegroup-canaan-debug"
