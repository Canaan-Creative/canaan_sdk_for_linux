require conf/distro/include/no-static-libs.inc
require conf/distro/include/yocto-uninative.inc
require conf/distro/include/security_flags.inc
PREFERRED_VERSION_mesa = "22.2.2"
PREFERRED_VERSION_clang = "18.1.8"
PREFERRED_VERSION_openmp = "18.1.8"
# uninative disabled: the SDK builds only in the docker/ Ubuntu 22.04 image,
# a fixed-glibc environment. With uninative on, its cross-glibc native gcc
# (e.g. gcc-13 / glibc-2.38 libs) mismatches the container gcc-11:
# qemu-native wants /usr/lib/gcc/.../13/libstdc++.a and libpseudo.so needs
# GLIBC_2.38 (fakeroot fails). Off, the build uses the container's gcc
# consistently. See docker/ + docs/BUILD.md.

# K230 target machine + distro (XuanTie C908, Linux 6.6, ruyisdk kernel, GCC toolchain)
# ?= so environment variables from build.sh (or the shell) take precedence.
# CANAAN_MACHINE is the canonical machine selector: canaan-k230.conf re-asserts
# MACHINE = "${CANAAN_MACHINE}" AFTER requiring rv64-k6.6-default.conf (which
# hard-sets MACHINE), so plain MACHINE alone cannot survive that require.
CANAAN_MACHINE ?= "k230-nano3s"
MACHINE ?= "k230-nano3s"
DISTRO ?= "canaan-k230"

# Canaan SDK root — used by meta-canaan EXTERNALSRC bbappends
CANAAN_SDK_ROOT = "${@os.path.abspath(os.path.join(d.getVar('TOPDIR'), '..', '..', '..', '..'))}"

DL_DIR ?= "${TOPDIR}/../downloads"

SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

PACKAGE_CLASSES ?= "package_deb"

# Root login root/root, strace and diagnostic tools in image, -Og -g.
# debug-tweaks: empty root password + allow-root-login.
EXTRA_IMAGE_FEATURES ?= "debug-tweaks canaan-debug"

# The root account is root/root, NOT the debug-tweaks empty password. One hash
# covers both ssh and serial (both authenticate via /etc/shadow). usermod -p
# wants an already crypted value ($6$ = SHA-512); this shadow has no clear-text
# (-P) option. The hash below is the literal password "root". Every `$` in the
# hash MUST stay `\$`: extrausers embeds EXTRA_USERS_PARAMS in a double-quoted
# shell assignment, so a bare `$6$canaandbg$p` is expanded to empty and the
# stored hash is truncated (root then unloginable). Do not "clean up" the
# backslashes.
IMAGE_CLASSES += "extrausers"
EXTRA_USERS_PARAMS = "usermod -p '\$6\$canaandbg\$p/X9DagP4S7Pbe20CfUxzYF3ErCTwq9C3ovfjMR5c5H2T5PvhYdBKU39YAKwPrYSEeY1XqHPfgvRbK.pRYzbU.' root;"
EXTRA_IMAGE_FEATURES:remove = " dev-pkgs staticdev-pkgs tools-debug"
IMAGE_FEATURES:remove = " dev-pkgs staticdev-pkgs tools-debug"
DEBUG_BUILD ?= "1"
USER_CLASSES ?= "buildstats buildhistory buildstats-summary"

# By default disable interactive patch resolution (tasks will just fail instead):
PATCHRESOLVE = "noop"

BB_DISKMON_DIRS ??= " \
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K \
"

CONF_VERSION = "2"

IMAGE_INSTALL:append = " "
PACKAGE_EXCLUDE = " "

CONNECTIVITY_CHECK_URIS = ""

############# from systemd to busybox ######
DISTRO_FEATURES:remove = " systemd "
DISTRO_FEATURES:append = " busybox sysvinit "
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"
VIRTUAL-RUNTIME_initscripts = "initscripts"
VIRTUAL-RUNTIME_keymaps = "keymaps"
VIRTUAL-RUNTIME_login_manager = "busybox"

INHIBIT_PACKAGE_DEBUG_SPLIT = "0"
# package-management (apt/dpkg) is NOT enabled SDK-wide: miners update through
# AUP OTA, not apt.
PACKAGECONFIG:append:pn-qemu-native = " sdl"
PACKAGECONFIG:append:pn-nativesdk-qemu = " sdl"

DISTRO_FEATURES:append = " largefile ptest multiarch wayland opengl opencl vulkan pam systemd"
DISTRO_FEATURES:append = " apt gobject-introspection-data polkit"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
HOSTTOOLS_NONFATAL:append = " ssh"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "gobject-introspection-data"

IMAGE_ROOTFS_ALIGNMENT = "4096"
IMAGE_ROOTFS_EXTRA_SPACE = "20480"
IMAGE_OVERHEAD_FACTOR = "1.1"
DEFAULT_TIMEZONE = "Etc/UTC"

SSTATE_SKIP_CREATION:pn-u-boot-fpga = "1"
SSTATE_SKIP_CREATION:pn-zsb = "1"
SSTATE_SKIP_CREATION:pn-opensbi = "1"
SSTATE_SKIP_CREATION:pn-libjpeg-turbo = "1"
SSTATE_SKIP_CREATION:pn-ffmpeg = "1"
SSTATE_SKIP_CREATION:pn-opencv = "1"
SSTATE_SKIP_CREATION:pn-zlib = "1"
SSTATE_SKIP_CREATION:pn-csi-2d = "1"
SSTATE_SKIP_CREATION:pn-zstd = "1"
SSTATE_SKIP_CREATION:pn-libeigen = "1"
SSTATE_SKIP_CREATION:pn-libpng = "1"
SSTATE_SKIP_CREATION:pn-openblas = "1"
SSTATE_SKIP_CREATION:pn-iperf3 = "1"
SSTATE_SKIP_CREATION:pn-coremark = "1"
SSTATE_SKIP_CREATION:pn-lmbench = "1"
SSTATE_SKIP_CREATION:pn-dhrystone = "1"
SSTATE_SKIP_CREATION:pn-sysbench = "1"
SSTATE_SKIP_CREATION:pn-unixbench = "1"
SSTATE_SKIP_CREATION:pn-iperf2 = "1"
SSTATE_SKIP_CREATION:pn-aibench = "1"
SSTATE_SKIP_CREATION:pn-csi-nn2-release = "1"
SSTATE_SKIP_CREATION:pn-optee-test = "1"
SSTATE_SKIP_CREATION:pn-mbedtls = "1"
SSTATE_SKIP_CREATION:pn-optee-client = "1"
SSTATE_SKIP_CREATION:pn-optee-os = "1"
SSTATE_SKIP_CREATION:pn-optee-os-fpga = "1"
SSTATE_SKIP_CREATION:pn-optee-examples = "1"
SSTATE_SKIP_CREATION:pn-trusted-firmware-a = "1"
SSTATE_SKIP_CREATION:pn-trusted-firmware-a-fpga = "1"
SSTATE_SKIP_CREATION:pn-opkg-utils = "1"

# Fetch from upstream sources; no source or sstate mirror.
SOURCE_MIRROR_URL = ""
SSTATE_MIRRORS = ""
# own-mirrors (inherited via meta-xuantie xuantie-base.inc) prepends PREMIRRORS
# pairs built from SOURCE_MIRROR_URL. With it empty, each pair has no replacement
# and bitbake warns "Invalid mirror data ... should have paired members" on every
# do_fetch. We fetch upstream directly, so drop the inherit.
INHERIT:remove = "own-mirrors"

# Use system quilt (/usr/bin/quilt) instead of building quilt-native
ASSUME_PROVIDED:append = " quilt-native"
HOSTTOOLS:append = " quilt"

