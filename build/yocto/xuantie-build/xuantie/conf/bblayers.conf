# xuantie-build/xuantie/conf/bblayers.conf.
# LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
LCONF_VERSION = "7"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

YOCTOROOT = "${@os.path.abspath("${TOPDIR}/../../")}"
CANAAN_SDK_ROOT = "${@os.path.abspath("${TOPDIR}/../../../../")}"

BBLAYERS ?= " \
    ${YOCTOROOT}/openembedded-core/meta \
    ${YOCTOROOT}/meta-openembedded/meta-filesystems \
    ${YOCTOROOT}/meta-openembedded/meta-networking \
    ${YOCTOROOT}/meta-openembedded/meta-perl \
    ${YOCTOROOT}/meta-openembedded/meta-oe \
    ${YOCTOROOT}/meta-openembedded/meta-python \
    ${YOCTOROOT}/meta-openembedded/meta-webserver \
    ${YOCTOROOT}/meta-external-toolchain \
    ${YOCTOROOT}/meta-riscv \
    ${YOCTOROOT}/meta-xuantie \
    ${YOCTOROOT}/meta-k230 \
    ${YOCTOROOT}/meta-canaan \
    ${CANAAN_SDK_ROOT}/product/k230/common \
    ${CANAAN_SDK_ROOT}/product/k230/miner/common \
    ${CANAAN_SDK_ROOT}/product/k230/miner/avalon-home/nano3s \
    ${YOCTOROOT}/meta-clang \
"

# Extra layers, absolute paths from the CANAAN_EXTRA_LAYERS environment variable.
BBLAYERS += "${@d.getVar('CANAAN_EXTRA_LAYERS') or ''}"
