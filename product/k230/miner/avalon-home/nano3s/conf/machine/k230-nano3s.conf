# Avalon Nano3s SPI-NAND miner board (K230, XuanTie C908, RV64).
# The name matches k230-.*, the COMPATIBLE_MACHINE of linux-k230 and u-boot-k230.
require conf/machine/riscv64-k6.6ry-kcdefault-tcxt.conf

EXTRA_IMAGEDEPENDS += "u-boot:do_deploy opensbi:do_deploy"

UBOOT_DEFCONFIG = "k230_nano3s_defconfig"

KERNEL_DEVICETREE = "canaan/k230-nano3s.dtb"

# Headless; the console is UART1, as in the DTS stdout-path and U-Boot bootargs.
USE_VT = "0"
SERIAL_CONSOLES = "115200;ttyS1"

# The kernel boots from the linux_a partition; keep the Image out of /boot.
RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base = ""
