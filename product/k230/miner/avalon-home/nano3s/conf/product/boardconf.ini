[NANO3S]

PROD_NAME = "Avalon Nano3s"
MODEL = "Nano3s"
HW_TYPE = "N_MM1v1_X1"
SW_TYPE = "MM319"
BOARD = "nano3s"

HBOARD_COUNT = (1)
FAN_COUNT = (1)

MAX_ASIC_ON_SINGLE_HASH = (12)

; Core-rail window and enumeration rail, mV.
VOL_MIN = 3200
VOL_MAX = 4000
VOL_ENUM = 3314
; PLL park frequency, MHz.
INIT_FREQ = 100

; Frequency step per adjustment and spacing between PLL points, MHz.
ADJ_FREQ_INTERVAL = 6
FREQ_INTERVAL = 20

; Build the LCD/button UI (lvgl) and BLE Wi-Fi provisioning (gio-2.0): 1 or 0.
SUPPORT_LCD = 1
SUPPORT_BLE = 1
