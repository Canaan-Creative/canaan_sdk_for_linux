# The default image carries the miner. For a boot-only bring-up image, build
# canaan-image-minimal explicitly:
#   ./build.sh nano3s canaan-image-minimal
MACHINE=k230-nano3s
DISTRO=canaan-k230-nano3s
IMAGE=nano3s-image-full

PACK_SCRIPT=scripts/gen-spinand.sh

# Built with IMAGE before the pack step. It provides the /mntapp/release tree
# that gen-spinand.sh packs into app.ubifs.
EXTRA_IMAGES=nano3s-app-image

# AUP package revision, passed to gen_aup.py -v. It must be exactly two digits:
# the packager appends it to the build date with no separator (20260914 + 01 ->
# 2026091401), so any other width makes the version unparseable. Without this
# key gen-spinand.sh uses 01.
AUP_VER=${AUP_VER:-01}
