flash spinand-256M {
	# Physical eraseblock size in bytes.
	pebsize = 131072
	# Logical eraseblock size in bytes, as used by UBIFS.
	lebsize = 126976
	# Number of physical eraseblocks; the device size is pebsize * numpebs.
	numpebs = 2048
	# Minimum I/O unit size in bytes.
	minimum-io-unit-size = 2048
	# UBI VID header offset in bytes.
	vid-header-offset = 2048
	# Sub-page size in bytes.
	sub-page-size = 2048
}

image rootfs.ubifs {
	ubifs {
		extraargs = "-x zlib -U"
		space-fixup = false
	}
	size = 43M
	mountpoint = "linux/rootfs"
	flashtype = "spinand-256M"
}

image rootfs.ubi {
	ubi {
		extraargs=""
		minimize = true
	}
	partition ubi_rootfs_part {
		image = "rootfs.ubifs"
		autoresize = true
	}
	size = 43M
	flashtype = "spinand-256M"
}

image app.ubifs {
	ubifs {
		extraargs = "-x zlib -U"
		space-fixup = false
	}
	size = 10M
	mountpoint = "linux/app"
	flashtype = "spinand-256M"
}

image app.ubi {
	ubi {
		extraargs=""
		minimize = true
	}
	partition ubi_app_part {
		image = "app.ubifs"
		autoresize = true
	}
	size = 10M
	flashtype = "spinand-256M"
}

image data.ubifs {
	ubifs {
		extraargs = "-x zlib -U"
		space-fixup = false
	}
	size = 49M
	mountpoint = "linux/data"
	flashtype = "spinand-256M"
}

image data.ubi {
	ubi {
		extraargs=""
		minimize = true
	}
	partition ubi_data_part {
		image = "data.ubifs"
		autoresize = true
	}
	size = 49M
	flashtype = "spinand-256M"
}

image sysimage-spinand256m.kdimg {
	kdimage {
		image_info = "v1.1.0"
		chip_info = "K230"
		board_info = "K230_nano3s"
	}

	partition uboot_spl_a {
		offset = 0
		size = 512K
		erase-size = 512K
		image = "linux/uboot/fn_u-boot-spl.bin"
	}

	partition uboot_spl_b {
		offset = 512K
		size = 512K
		erase-size = 512K
		image = "linux/uboot/fn_u-boot-spl.bin"
	}

	partition uboot_a {
		offset = 1M
		size = 2M
		erase-size = 2M
		image = "linux/uboot/fn_ug_u-boot.bin"
	}

	partition uboot_b {
		offset = 3M
		size = 2M
		erase-size = 2M
		image = "linux/uboot/fn_ug_u-boot.bin"
	}

	partition uboot_env_a {
		offset = 5M
		size = 512K
		erase-size = 512K
		image = "linux/uboot/spinand.env"
	}

	partition uboot_env_b {
		offset = 0x580000
		size = 512K
		erase-size = 512K
		image = "linux/uboot/spinand.env"
	}

	partition rtt_a {
		offset = 6M
		size = 4M
		erase-size = 4M
		image = "rsvd/rtt_system.bin"
	}

	partition rtt_b {
		offset = 10M
		size = 4M
		erase-size = 4M
		image = "rsvd/rtt_system.bin"
	}

	partition linux_a {
		offset = 14M
		size = 8M
		erase-size = 8M
		image = "linux/linux_system.bin"
	}

	partition linux_b {
		offset = 22M
		size = 8M
		erase-size = 8M
		image = "linux/linux_system.bin"
	}

	# erase-size covers the whole MTD slot, not just the UBI image.
	partition rootfs_a {
		offset = 30M
		size = 47M
		erase-size = 48M
		image = "rootfs.ubi"
	}

	partition rootfs_b {
		offset = 78M
		size = 47M
		erase-size = 48M
		image = "rootfs.ubi"
	}

	partition app_a {
		offset = 126M
		size = 13M
		erase-size = 14M
		image = "app.ubi"
	}

	partition app_b {
		offset = 140M
		size = 13M
		erase-size = 14M
		image = "app.ubi"
	}

	partition data {
		offset = 200M
		size = 55M
		erase-size = 56M
		image = "data.ubi"
	}
}
